---
title: "<Your question or feedback about Themerr>"
labels: [Themerr]
body:
  - type: markdown
    attributes:
      value: >
        ⚠️ This category is solely for discussions and feedback on
        Themerr. ⚠️

        NOTE: If you post in this category about topics other than Themerr,
        your post may be moved or deleted without warning. Users who post spam or violate of our
        [Code of Conduct](https://github.com/LizardByte/.github/blob/master/CODE_OF_CONDUCT.md) will be blocked.
  - type: dropdown
    attributes:
      label: Select Themerr Product
      description: Which product would you like to discuss?
      multiple: true
      options:
        - "Themerr"
        - "ThemerrDB"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Select Media Server
      description: Which Media Server(s) does this discussion apply to?
      multiple: true
      options:
        - "Koko"
        - "Jellyfin"
        - "Kodi (Themerr for Kodi is archived)"
        - "Plex"
        - "Other (please describe)"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Select Topic Area
      description: What would you like to discuss?
      options:
        - "Question"
        - "Feature Request"
        - "Bug"
        - "Show & Tell"
        - "General"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Body
      description: Start your discussion!
    validations:
      required: true
