---
name: RSS Notifier
permissions: {}

on:
  issues:
    types:
      - opened

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorize.outputs.result }}
    steps:
      - name: Authorize
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          result-encoding: string
          script: |
            // get issue
            const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
            });

            // get author
            const author = issue.data.user.login;

            // check if author is LizardByte-bot
            if (author === 'LizardByte-bot') {
                console.log('Author is LizardByte-bot');
            } else {
                console.log('Author is not LizardByte-bot');
                return 'false';
            }

            // check if label is blog
            const labels = issue.data.labels.map(label => label.name);
            if (labels.includes('blog')) {
                console.log('Label is blog');
            } else {
                console.log('Label is not blog');
                return 'false';
            }

            return 'true';

  moonlight-conditions:
    if: needs.authorize.outputs.authorized == 'true'
    needs: authorize
    outputs:
      post: ${{ steps.conditions.outputs.result }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Moonlight Discord conditions
        id: conditions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          result-encoding: string
          script: |
            const title = context.payload.issue.title;
            const conditions = [
                {
                    name: 'Sunshine release',
                    matches: /^Sunshine v[0-9]+(?:\.[0-9]+)* Released$/.test(title)
                }
            ];

            for (const condition of conditions) {
                console.log(`${condition.name}: ${condition.matches}`);
            }

            return conditions.some(condition => condition.matches) ? 'true' : 'false';

  discord:
    if: needs.authorize.outputs.authorized == 'true'
    needs: authorize
    outputs:
      post-url: "https://discord.com/channels/804382334370578482/804383203020374016"
    runs-on: ubuntu-latest
    steps:
      - name: discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        with:
          avatar_url: ${{ vars.ORG_LOGO_URL }}256
          color: 0x${{ vars.COLOR_HEX_GREEN }}
          nodetail: true
          nofail: false
          title: ${{ github.event.issue.title }}
          url: ${{ github.event.issue.body }}
          username: ${{ vars.DISCORD_USERNAME }}
          webhook: ${{ secrets.DISCORD_ANNOUNCEMENT_WEBHOOK }}

  discord-moonlight:
    if: needs.moonlight-conditions.outputs.post == 'true'
    needs: moonlight-conditions
    outputs:
      post-url: "https://discord.com/channels/352065098472488960/465373705846128660"
    runs-on: ubuntu-latest
    steps:
      - name: discord-moonlight
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        with:
          avatar_url: ${{ vars.ORG_LOGO_URL }}256
          color: 0x${{ vars.COLOR_HEX_GREEN }}
          nodetail: true
          nofail: false
          title: ${{ github.event.issue.title }}
          url: ${{ github.event.issue.body }}
          username: ${{ vars.DISCORD_USERNAME }}
          webhook: ${{ secrets.DISCORD_RELEASE_WEBHOOK_MOONLIGHT }}

  facebook:
    if: needs.authorize.outputs.authorized == 'true'
    needs: authorize
    outputs:
      post-url: "https://www.facebook.com/LizardByteDev"
    runs-on: ubuntu-latest
    steps:
      - name: facebook-post-action
        uses: LizardByte/actions/actions/facebook_post@a46850981292c4bbc0c41715f286ad95adaaaf4a  # v2026.625.20301
        with:
          page_id: ${{ secrets.FACEBOOK_PAGE_ID }}
          access_token: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          message: ${{ github.event.issue.title }}
          url: ${{ github.event.issue.body }}

  reddit:
    if: needs.authorize.outputs.authorized == 'true'
    needs: authorize
    outputs:
      post-url: ${{ steps.post.outputs.postUrl }}
    runs-on: ubuntu-latest
    steps:
      - name: reddit
        id: post
        uses: bluwy/release-for-reddit-action@b4ee0e0d64da893e0428912aac5cda675082bd85  # v2
        with:
          username: ${{ vars.REDDIT_USERNAME }}
          password: ${{ secrets.REDDIT_PASSWORD }}
          app-id: ${{ secrets.REDDIT_CLIENT_ID }}
          app-secret: ${{ secrets.REDDIT_CLIENT_SECRET }}
          subreddit: ${{ vars.REDDIT_SUBREDDIT }}
          title: ${{ github.event.issue.title }}
          url: ${{ github.event.issue.body }}
          flair-id: ${{ secrets.REDDIT_FLAIR_ID }}  # https://www.reddit.com/r/<subreddit>>/api/link_flair.json

  close-issue:
    if: always() && needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
      - discord
      - discord-moonlight
      - moonlight-conditions
      - facebook
      - reddit
    runs-on: ubuntu-latest
    steps:
      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          get_emoji() {
            if [ "$1" == "success" ]; then
              echo ":white_check_mark:"
            elif [ "$1" == "failure" ]; then
              echo ":x:"
            else
              echo ":grey_question:"
            fi
          }

          # Build comment as a single line with literal newlines
          comment="| Job | Status | Post URL |
          | --- |:------:| -------- |
          | Discord | $(get_emoji "${{ needs.discord.result }}") | ${{ needs.discord.outputs.post-url }} |
          | Facebook | $(get_emoji "${{ needs.facebook.result }}") | ${{ needs.facebook.outputs.post-url }} |
          | Reddit | $(get_emoji "${{ needs.reddit.result }}") | ${{ needs.reddit.outputs.post-url }} |"

          if [ "${{ needs.moonlight-conditions.outputs.post }}" == "true" ]; then
            moonlight_status="${{ needs.discord-moonlight.result }}"
            moonlight_url="${{ needs.discord-moonlight.outputs.post-url }}"
            comment="${comment}
          | Discord Moonlight | $(get_emoji "${moonlight_status}") | ${moonlight_url} |"
          fi

          close_reason="completed"
          lock_reason="resolved"

          gh issue close ${{ github.event.issue.number }} \
            --comment "${comment}" \
            --reason "${close_reason}" \
            --repo "${{ github.repository }}"
          gh issue lock ${{ github.event.issue.number }} \
            --reason "${lock_reason}" \
            --repo "${{ github.repository }}"
